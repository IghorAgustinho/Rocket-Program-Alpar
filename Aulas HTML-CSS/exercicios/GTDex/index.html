<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTDex</title>
    <link rel="stylesheet" href="./assets/style.css">
</head>

<body>
    <header>
        <h1>CarroDex</h1>
        <input type="text" id="inputBusca" placeholder="Buscar por modelo ou marca...">
        <button id="btnAbrirForm" class="btn-adicionar">+ Adicionar Carro</button>

        <div id="modalForm" class="modal oculto">
            <div class="conteudo-modal form-modal">
                <span id="fecharForm" class="btn-fechar">&times;</span>
                <h2>Adicionar Novo Carro</h2>


                <form id="formNovoCarro">
                    <input type="text" id="inputNome" placeholder="Nome do Carro (ex: Civic Si '08)" required>
                    <input type="text" id="inputMarca" placeholder="Marca (ex: Honda)" required>
                    <input type="url" id="inputImagem" placeholder="URL da Imagem da internet" required>
                    <input type="url" id="inputImagem2" placeholder="URL da Imagem da internet" required>
                    <textarea id="inputDescricao" placeholder="Breve história ou descrição do carro..."
                        required></textarea>

                    <div class="specs-grid-form">
                        <input type="text" id="inputCategoria" placeholder="Categoria (ex: Gr.N)" required>
                        <input type="text" id="inputPP" placeholder="PP (ex: 500.50)" required>
                        <input type="text" id="inputCilindrada" placeholder="Cilindrada (ex: 1998 cc)" required>
                        <input type="text" id="inputTracao" placeholder="Tração (ex: FF)" required>
                        <input type="text" id="inputPotencia" placeholder="Potência (ex: 197 HP)" required>
                        <input type="text" id="inputTorque" placeholder="Torque (ex: 139 ft-lb)" required>
                        <input type="text" id="inputPeso" placeholder="Peso (ex: 2888 lbs)" required>
                        <input type="text" id="inputAspiracao" placeholder="Aspiração (ex: NA)" required>
                        <input type="text" id="inputComprimento" placeholder="Comprimento (in.)" required>
                        <input type="text" id="inputLargura" placeholder="Largura (in.)" required>
                        <input type="text" id="inputAltura" placeholder="Altura (in.)" required>
                    </div>

                    <button type="submit" class="btn-salvar">Salvar na Dex</button>
                </form>


            </div>
        </div>
    </header>

    <main>
        <div id="containerDex" class="grid-container">
        </div>
    </main>

    <div id="modalCarro" class="modal oculto">
        <div class="conteudo-modal">
            <span id="botaoFechar" class="btn-fechar">&times;</span>
            <img id="imgModal" src="" alt="Imagem do Carro">

            <h2 id="nomeModal"></h2>

            <h3 id="tituloDescricaoModal" class="titulo-destaque"></h3>
            <p id="descricaoModal" class="texto-descricao"></p>

            <div class="cabecalho-specs">
                <span id="categoriaModal" class="badge-categoria"></span>
                <span class="texto-pp">PP <span id="ppModal"></span></span>
            </div>

            <div class="tabela-specs">
                <div class="linha-spec"><span>Cilindrada</span> <strong id="cilindradaModal"></strong></div>
                <div class="linha-spec"><span>Tração</span> <strong id="tracaoModal"></strong></div>
                <div class="linha-spec"><span>Potência Máxima</span> <strong id="potenciaModal"></strong></div>
                <div class="linha-spec"><span>Torque Máximo</span> <strong id="torqueModal"></strong></div>
                <div class="linha-spec"><span>Peso</span> <strong id="pesoModal"></strong></div>
                <div class="linha-spec"><span>Aspiração</span> <strong id="aspiracaoModal"></strong></div>
                <div class="linha-spec"><span>Comprimento</span> <strong id="comprimentoModal"></strong></div>
                <div class="linha-spec"><span>Largura</span> <strong id="larguraModal"></strong></div>
                <div class="linha-spec"><span>Altura</span> <strong id="alturaModal"></strong></div>
            </div>
        </div>
    </div>

    <script src="./assets/script.js"></script>
</body>

</html>
